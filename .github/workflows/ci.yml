name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require README
        run: test -s README.md
      - name: Check for committed secrets patterns
        shell: bash
        run: |
          if grep -RInE "(api[_-]?key|secret|password|token)[[:space:]]*=[[:space:]]*['\"'][^'\"']{8,}" . --exclude-dir=.git --exclude='*.lock' --exclude='*.example' --exclude='.env.example'; then
            echo "Potential hard-coded secret pattern found."
            exit 1
          fi

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile sources
        run: python -m compileall -q .
      - name: Run headless Python smoke check
        shell: bash
        run: |
          python -m compileall -q .
          echo "Headless smoke check passed; Spark and serving tests run in dedicated workflows."

  node:
    name: Node build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        shell: bash
        run: |
          for package in $(find . -name package.json -not -path "./node_modules/*"); do
            directory=$(dirname "$package")
            cd "$directory"
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            if npm run | grep -q " build"; then npm run build; fi
            cd - >/dev/null
          done

  containers:
    name: Container configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        shell: bash
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi
          for compose in $(find . -name docker-compose.yml -o -name compose.yml); do
            if [ -f .env.example ]; then docker compose --env-file .env.example -f "$compose" config --quiet; else docker compose -f "$compose" config --quiet; fi
          done
