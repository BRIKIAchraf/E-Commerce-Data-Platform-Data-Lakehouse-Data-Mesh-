name: PySpark Spark Jobs CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pyspark_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java Runtime (Spark dependency)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyspark==3.4.1 delta-spark==2.4.0 pytest==7.3.1 pandas==2.0.3 fastapi==0.95.2 uvicorn==0.22.0 mlflow==2.7.1 confluent-kafka==2.1.1 great-expectations==0.17.15 dbt-snowflake==1.5.2

      - name: Run PyTest
        run: |
          pytest tests/ -v
