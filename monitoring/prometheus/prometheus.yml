global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka-lag-exporter'
    static_configs:
      - targets: ['localhost:9308']

  - job_name: 'airflow-metrics'
    static_configs:
      - targets: ['airflow-webserver:8080']
